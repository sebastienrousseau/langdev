{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic Code & Terminal IDE Preview -->
    <figure class="terminal-preview-card">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar">
          <span class="tab-item active-tab font-mono">src/mcp-server.sh</span>
          <span class="tab-item font-mono">terminal</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● TMUX IDE + MCP Server</span>
        </div>
      </figcaption>
      <div class="terminal-editor-pane">
        <pre class="editor-code font-mono"><code><span class="code-comment"># src/mcp-server.sh · JSON-RPC 2.0 Stdio Model Context Protocol Server</span>
<span class="code-kw">while read</span> -r line; <span class="code-kw">do</span>
  method=$(echo <span class="code-str">"$line"</span> | jq -r .method)
  <span class="code-kw">case</span> <span class="code-str">"$method"</span> <span class="code-kw">in</span>
    <span class="code-str">"tools/list"</span>) send_tools_manifest ;;
    <span class="code-str">"tools/call"</span>) dispatch_tool <span class="code-str">"$(echo "$line" | jq -r .params)"</span> ;;
  <span class="code-kw">esac</span>
<span class="code-kw">done</span> &lt; /dev/stdin</code></pre>
      </div>
      <div class="terminal-cli-pane font-mono">
        <div class="cli-line"><span class="mcp-tl-ps">$ </span>make doctor &amp;&amp; make test</div>
        <div class="cli-out">[OK] Container engine: podman / docker (&lt; 500ms cold start) · cap_drop [ALL]</div>
        <div class="cli-line"><span class="mcp-tl-ask">&gt; </span>Claude MCP: Spawn ephemeral muxtree worktree and run test suite</div>
        <div class="cli-out cli-ok">✓ 100% Bats hermetic unit tests passed · read-only rootfs · non-root UID 1000</div>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
